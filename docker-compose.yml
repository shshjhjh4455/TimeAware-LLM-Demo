services:
  backend:
    build:
      context: .
      dockerfile: webapp/backend/Dockerfile
    volumes:
      - ./knowledge_enriched_rag:/app/knowledge_enriched_rag
      - ./timechara:/app/timechara
      - ./.env:/app/.env
    network_mode: host
    environment:
      - PYTHONPATH=/app
      - NVIDIA_VISIBLE_DEVICES=all
    runtime: nvidia
    restart: unless-stopped

  frontend:
    build:
      context: webapp/frontend
      dockerfile: Dockerfile
    network_mode: host
    depends_on:
      - backend
    restart: unless-stopped
