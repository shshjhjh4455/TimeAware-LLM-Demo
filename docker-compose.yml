services:
  backend:
    build:
      context: .
      dockerfile: webapp/backend/Dockerfile
    volumes:
      - ./knowledge_enriched_rag:/app/knowledge_enriched_rag
      - ./timechara:/app/timechara
      - ./.env:/app/.env
    ports:
      - "5000:5000"
    environment:
      - PYTHONPATH=/app
      - NVIDIA_VISIBLE_DEVICES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  frontend:
    build:
      context: webapp/frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
